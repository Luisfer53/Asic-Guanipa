openapi: 3.0.0
info:
  title: API de Proyecto Uptjaa CDI
  description: Documentación de la API para el sistema de registro de pacientes y autenticación.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Servidor de Desarrollo

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    Patient:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
        cedula:
          type: string
          nullable: true
        fecha_nacimiento:
          type: string
          format: date
        sexo:
          type: string
          enum: [M, F]
        telefono:
          type: string
        direccion:
          type: string
        nombre_representante:
          type: string
        apellido_representante:
          type: string
        cedula_representante:
          type: string
        telefono_representante:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attention:
      type: object
      properties:
        id:
          type: integer
        paciente_id:
          type: integer
        diagnostico:
          type: string
        fecha:
          type: string
          format: date
        edad_atencion:
          type: integer
        id_usuario_registra:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        paciente:
          $ref: '#/components/schemas/Patient'
        usuario:
          type: object
          properties:
            username:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: object

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: Crea una nueva cuenta de usuario. Requiere rol de Administrador.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  description: Debe contener al menos una mayúscula, una minúscula y un número.
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos o usuario ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
        '403':
          description: Prohibido (Requiere rol Admin)

  /auth/login:
    post:
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '401':
          description: Credenciales inválidas

  /auth/forgot-password:
    post:
      summary: Solicitar recuperación de contraseña
      description: Envía un email con un token para restablecer la contraseña.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Solicitud procesada (si el email existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string

  /auth/reset-password:
    post:
      summary: Restablecer contraseña
      description: Cambia la contraseña usando un token válido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Contraseña restablecida exitosamente
        '400':
          description: Token inválido o expirado

  /auth/profile:
    get:
      summary: Obtener perfil del usuario
      description: Devuelve la información del usuario autenticado.
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autorizado

  /auth/users/{id}:
    put:
      summary: Actualizar usuario
      description: Actualiza los datos de un usuario. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del usuario
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [Admin, Medico, Asistente, Basico]
      responses:
        '200':
          description: Usuario actualizado exitosamente
        '404':
          description: Usuario no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)
    delete:
      summary: Eliminar usuario
      description: Elimina un usuario. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del usuario
      responses:
        '200':
          description: Usuario eliminado exitosamente
        '404':
          description: Usuario no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)

  /pacientes:
    get:
      summary: Listar atenciones de pacientes
      description: Obtiene una lista de registros de atenciones. Permite filtrar por fecha o cédula.
      parameters:
        - in: query
          name: fecha
          schema:
            type: string
            format: date
          description: Filtrar por fecha (YYYY-MM-DD)
        - in: query
          name: cedula
          schema:
            type: string
          description: Filtrar por cédula
      responses:
        '200':
          description: Lista de atenciones obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attention'
    post:
      summary: Registrar paciente y atención
      description: Crea un nuevo registro de paciente (si no existe) y una nueva atención (visita).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - apellido
                - sexo
                - fecha
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                cedula:
                  type: string
                  description: Opcional para menores de edad.
                fecha_nacimiento:
                  type: string
                  format: date
                edad:
                  type: integer
                  description: Opcional si se provee fecha_nacimiento. Edad al momento de la atención.
                sexo:
                  type: string
                  enum: [M, F]
                telefono:
                  type: string
                direccion:
                  type: string
                diagnostico:
                  type: string
                fecha:
                  type: string
                  format: date
                nombre_representante:
                  type: string
                  description: Requerido para menores de edad.
                apellido_representante:
                  type: string
                  description: Requerido para menores de edad.
                cedula_representante:
                  type: string
                  description: Requerido para menores de edad.
                telefono_representante:
                  type: string
                  description: Requerido para menores de edad.
      responses:
        '201':
          description: Registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      patient:
                        $ref: '#/components/schemas/Patient'
                      attention:
                        $ref: '#/components/schemas/Attention'
        '400':
          description: Datos faltantes o inválidos

  /pacientes/{cedula}/historial:
    get:
      summary: Obtener historial de paciente
      description: Obtiene todas las atenciones asociadas a una cédula específica.
      parameters:
        - in: path
          name: cedula
          required: true
          schema:
            type: string
          description: Cédula del paciente
      responses:
        '200':
          description: Historial obtenido
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attention'

  /pacientes/atencion/{id}:
    get:
      summary: Obtener atención por ID
      description: Obtiene los detalles de una atención específica.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la atención
      responses:
        '200':
          description: Atención obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Attention'
        '404':
          description: Atención no encontrada

  /pacientes/{id}:
    put:
      summary: Actualizar registro de atención (y paciente)
      description: Actualiza los datos de una atención específica y opcionalmente datos del paciente asociado. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la atención
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                diagnostico:
                  type: string
                fecha:
                  type: string
                  format: date
                edad:
                  type: integer
                nombre:
                  type: string
                apellido:
                  type: string
                sexo:
                  type: string
                telefono:
                  type: string
                direccion:
                  type: string
                cedula:
                  type: string
                fecha_nacimiento:
                  type: string
                  format: date
      responses:
        '200':
          description: Actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Attention'
        '404':
          description: Registro no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)

    delete:
      summary: Eliminar registro de atención
      description: Elimina una atención específica. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la atención
      responses:
        '200':
          description: Eliminado exitosamente
        '404':
          description: Registro no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)

  /reportes:
    get:
      summary: Generar reporte diario
      description: Genera un reporte de los pacientes atendidos con paginación y estadísticas. Requiere rol Admin.
      parameters:
        - in: query
          name: fecha
          schema:
            type: string
            format: date
          description: Fecha del reporte (YYYY-MM-DD)
        - in: query
          name: formato
          schema:
            type: string
            enum: [json, excel]
            default: json
          description: Formato de salida
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Límite de registros por página
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
          description: Desplazamiento para paginación
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  fecha:
                    type: string
                    format: date
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      pages:
                        type: integer
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                      hombres:
                        type: integer
                      mujeres:
                        type: integer
                      menores:
                        type: integer
                      mayores:
                        type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attention'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
