openapi: 3.0.0
info:
  title: API de Proyecto Uptjaa CDI
  description: Documentación de la API para el sistema de registro de pacientes y autenticación.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Servidor de Desarrollo

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    Patient:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
        cedula:
          type: string
          nullable: true
        fecha_nacimiento:
          type: string
          format: date
        sexo:
          type: string
          enum: [M, F]
        telefono:
          type: string
        direccion:
          type: string
        nombre_representante:
          type: string
        apellido_representante:
          type: string
        cedula_representante:
          type: string
        telefono_representante:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attention:
      type: object
      properties:
        id:
          type: integer
        paciente_id:
          type: integer
        diagnostico:
          type: string
        fecha:
          type: string
          format: date
        edad_atencion:
          type: integer
        id_usuario_registra:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        paciente:
          $ref: '#/components/schemas/Patient'
        usuario:
          type: object
          properties:
            username:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: object

    LoteInsumo:
      type: object
      properties:
        id:
          type: integer
        id_articulo:
          type: integer
        numero_lote:
          type: string
        stock_actual:
          type: integer
        fecha_vencimiento:
          type: string
          format: date

    ConsumoInsumo:
      type: object
      properties:
        id:
          type: integer
        id_atencion:
          type: integer
        id_lote_insumo:
          type: integer
        cantidad_usada:
          type: integer

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: Crea una nueva cuenta de usuario. Requiere rol de Administrador.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  description: Debe contener al menos una mayúscula, una minúscula y un número.
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos o usuario ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
        '403':
          description: Prohibido (Requiere rol Admin)

  /auth/login:
    post:
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '401':
          description: Credenciales inválidas

  /auth/forgot-password:
    post:
      summary: Solicitar recuperación de contraseña
      description: Envía un email con un token para restablecer la contraseña.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Solicitud procesada (si el email existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string

  /auth/reset-password:
    post:
      summary: Restablecer contraseña
      description: Cambia la contraseña usando un token válido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Contraseña restablecida exitosamente
        '400':
          description: Token inválido o expirado


  /auth/users:
    get:
      summary: Listar todos los usuarios
      description: Obtiene una lista de todos los usuarios registrados con sus roles. Requiere rol Admin.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/User'
                        - type: object
                          properties:
                            roles:
                              type: array
                              items:
                                type: string
        '403':
          description: Prohibido (Requiere rol Admin)

  /auth/profile:
    get:
      summary: Obtener perfil del usuario
      description: Devuelve la información del usuario autenticado.
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autorizado

  /auth/users/{id}:
    put:
      summary: Actualizar usuario
      description: Actualiza los datos de un usuario. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del usuario
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [Admin, Medico, Asistente, Basico]
      responses:
        '200':
          description: Usuario actualizado exitosamente
        '404':
          description: Usuario no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)
    delete:
      summary: Eliminar usuario
      description: Elimina un usuario. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del usuario
      responses:
        '200':
          description: Usuario eliminado exitosamente
        '404':
          description: Usuario no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)

  /pacientes:
    get:
      summary: Listar atenciones de pacientes
      description: Obtiene una lista de registros de atenciones. Permite filtrar por fecha o cédula.
      parameters:
        - in: query
          name: fecha
          schema:
            type: string
            format: date
          description: Filtrar por fecha (YYYY-MM-DD)
        - in: query
          name: cedula
          schema:
            type: string
          description: Filtrar por cédula
      responses:
        '200':
          description: Lista de atenciones obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attention'
    post:
      summary: Registrar paciente (solo datos)
      description: |
        Registra un nuevo paciente en el sistema sin crear una atención médica.
        - Para mayores de 18 años, la cédula es obligatoria.
        - Para menores de 18 años, los datos del representante son obligatorios.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - apellido
                - fecha_nacimiento
                - sexo
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                cedula:
                  type: string
                  description: Obligatoria para mayores de edad
                fecha_nacimiento:
                  type: string
                  format: date
                sexo:
                  type: string
                  enum: [M, F]
                telefono:
                  type: string
                direccion:
                  type: string
                nombre_representante:
                  type: string
                apellido_representante:
                  type: string
                cedula_representante:
                  type: string
                telefono_representante:
                  type: string
            examples:
              adulto:
                summary: Registro de adulto
                value:
                  nombre: "Juan"
                  apellido: "Perez"
                  cedula: "12345678"
                  fecha_nacimiento: "1990-05-15"
                  sexo: "M"
                  telefono: "04141112233"
                  direccion: "Calle Falsa 123"
              menor:
                summary: Registro de menor
                value:
                  nombre: "Carlitos"
                  apellido: "Perez"
                  fecha_nacimiento: "2015-10-20"
                  sexo: "M"
                  nombre_representante: "Juan"
                  apellido_representante: "Perez"
                  cedula_representante: "12345678"
                  telefono_representante: "04141112233"
      responses:
        '201':
          description: Paciente registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Patient'
        '400':
          description: Error de validación o paciente ya existe

  /pacientes/contactos:
    get:
      summary: Listar contactos de pacientes
      description: Obtiene una lista de pacientes con solo sus datos de contacto. Permite filtrar por cédula.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cedula
          schema:
            type: string
          description: Filtrar por cédula (coincidencia parcial)
      responses:
        '200':
          description: Lista de contactos obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre:
                          type: string
                        apellido:
                          type: string
                        cedula:
                          type: string
                        telefono:
                          type: string
                        direccion:
                          type: string
        '401':
          description: No autorizado
        '500':
          description: Error del servidor

  /pacientes/{cedula}/historial:
    get:
      summary: Obtener historial de paciente
      description: Obtiene todas las atenciones asociadas a una cédula específica.
      parameters:
        - in: path
          name: cedula
          required: true
          schema:
            type: string
          description: Cédula del paciente
      responses:
        '200':
          description: Historial obtenido
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attention'

  /pacientes/atencion/{id}:
    get:
      summary: Obtener atención por ID
      description: Obtiene los detalles de una atención específica.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la atención
      responses:
        '200':
          description: Atención obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Attention'
        '404':
          description: Atención no encontrada

  /pacientes/{id}:
    put:
      summary: Actualizar registro de atención (y paciente)
      description: Actualiza los datos de una atención específica y opcionalmente datos del paciente asociado. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la atención
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                diagnostico:
                  type: string
                fecha:
                  type: string
                  format: date
                edad:
                  type: integer
                nombre:
                  type: string
                apellido:
                  type: string
                sexo:
                  type: string
                telefono:
                  type: string
                direccion:
                  type: string
                cedula:
                  type: string
                fecha_nacimiento:
                  type: string
                  format: date
      responses:
        '200':
          description: Actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Attention'
        '404':
          description: Registro no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)

    delete:
      summary: Eliminar registro de atención
      description: Elimina una atención específica. Requiere rol Admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la atención
      responses:
        '200':
          description: Eliminado exitosamente
        '404':
          description: Registro no encontrado
        '403':
          description: Prohibido (Requiere rol Admin)

  /reportes:
    get:
      summary: Generar reporte diario
      description: Genera un reporte de los pacientes atendidos con paginación y estadísticas. Requiere rol Admin.
      parameters:
        - in: query
          name: fecha
          schema:
            type: string
            format: date
          description: Fecha del reporte (YYYY-MM-DD)
        - in: query
          name: formato
          schema:
            type: string
            enum: [json, excel]
            default: json
          description: Formato de salida
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Límite de registros por página
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
          description: Desplazamiento para paginación
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  fecha:
                    type: string
                    format: date
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      pages:
                        type: integer
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                      hombres:
                        type: integer
                      mujeres:
                        type: integer
                      menores:
                        type: integer
                      mayores:
                        type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attention'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary


  /atenciones/registrar-completo:
    post:
      summary: Registrar paciente y atención (flujo completo)
      description: |
        Endpoint unificado que implementa el flujo completo de registro:
        1. Busca al paciente por cédula
        2. Si existe, actualiza datos opcionales (teléfono, dirección, representante)
        3. Si no existe, crea un nuevo paciente
        4. Valida disponibilidad de stock de insumos
        5. Registra la atención diaria
        6. Registra el consumo de insumos (el trigger de BD deduce el stock automáticamente)
        
        Todo se ejecuta en una transacción atómica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paciente
                - atencion
              properties:
                cedula:
                  type: string
                  description: Cédula del paciente. Obligatoria para mayores de 18 años, opcional para menores.
                  example: "12345678"
                paciente:
                  type: object
                  required:
                    - nombre
                    - apellido
                    - fecha_nacimiento
                    - sexo
                  properties:
                    nombre:
                      type: string
                      example: "Juan"
                    apellido:
                      type: string
                      example: "Pérez"
                    fecha_nacimiento:
                      type: string
                      format: date
                      description: Fecha de nacimiento (obligatoria para calcular edad)
                      example: "1990-05-15"
                    sexo:
                      type: string
                      enum: [M, F]
                      example: "M"
                    telefono:
                      type: string
                      example: "04141234567"
                    direccion:
                      type: string
                      example: "Calle Principal, Casa 123"
                    nombre_representante:
                      type: string
                      description: Obligatorio para menores de 18 años
                      example: "María"
                    apellido_representante:
                      type: string
                      description: Obligatorio para menores de 18 años
                      example: "González"
                    cedula_representante:
                      type: string
                      description: Obligatorio para menores de 18 años
                      example: "87654321"
                    telefono_representante:
                      type: string
                      description: Obligatorio para menores de 18 años
                      example: "04149876543"
                atencion:
                  type: object
                  required:
                    - diagnostico
                  properties:
                    diagnostico:
                      type: string
                      example: "Consulta general"
                    fecha:
                      type: string
                      format: date
                      description: Fecha de la atención (por defecto hoy)
                      example: "2026-01-22"
                consumos:
                  type: array
                  description: Lista de insumos consumidos durante la atención
                  items:
                    type: object
                    required:
                      - id_lote_insumo
                      - cantidad_usada
                    properties:
                      id_lote_insumo:
                        type: integer
                        example: 1
                      cantidad_usada:
                        type: integer
                        example: 2
            examples:
              paciente_nuevo_mayor:
                summary: Paciente nuevo mayor de edad
                value:
                  cedula: "12345678"
                  paciente:
                    nombre: "Juan"
                    apellido: "Pérez"
                    fecha_nacimiento: "1990-05-15"
                    sexo: "M"
                    telefono: "04141234567"
                    direccion: "Calle Principal"
                  atencion:
                    diagnostico: "Consulta general"
                    fecha: "2026-01-22"
                  consumos:
                    - id_lote_insumo: 1
                      cantidad_usada: 2
              paciente_existente:
                summary: Paciente existente (actualiza datos)
                value:
                  cedula: "12345678"
                  paciente:
                    nombre: "Juan"
                    apellido: "Pérez"
                    fecha_nacimiento: "1990-05-15"
                    sexo: "M"
                    telefono: "04149999999"
                    direccion: "Nueva dirección"
                  atencion:
                    diagnostico: "Control de seguimiento"
                  consumos: []
              paciente_menor:
                summary: Paciente menor de edad
                value:
                  paciente:
                    nombre: "Carlos"
                    apellido: "Rodríguez"
                    fecha_nacimiento: "2015-03-10"
                    sexo: "M"
                    nombre_representante: "María"
                    apellido_representante: "González"
                    cedula_representante: "87654321"
                    telefono_representante: "04149876543"
                  atencion:
                    diagnostico: "Consulta pediátrica"
                  consumos:
                    - id_lote_insumo: 2
                      cantidad_usada: 1
      responses:
        '201':
          description: Paciente y atención registrados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Paciente y atención registrados exitosamente"
                  data:
                    type: object
                    properties:
                      paciente:
                        $ref: '#/components/schemas/Patient'
                      atencion:
                        $ref: '#/components/schemas/Attention'
                      paciente_existia:
                        type: boolean
                        description: Indica si el paciente ya existía en la base de datos
                        example: false
        '400':
          description: Error de validación o stock insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                campos_faltantes:
                  summary: Campos obligatorios faltantes
                  value:
                    success: false
                    message: "Nombre, apellido y sexo son obligatorios"
                stock_insuficiente:
                  summary: Stock insuficiente
                  value:
                    success: false
                    message: "Stock insuficiente para el lote ABC123. Disponible: 5, Solicitado: 10"
                menor_sin_representante:
                  summary: Menor sin datos de representante
                  value:
                    success: false
                    message: "Para menores de edad, los datos del representante son obligatorios"
                mayor_sin_cedula:
                  summary: Mayor de edad sin cédula
                  value:
                    success: false
                    message: "La cédula es obligatoria para mayores de edad"
        '404':
          description: Lote de insumo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Lote con ID 999 no encontrado."

  /atenciones:
    post:
      summary: Registrar atención para paciente existente
      description: Registra una nueva atención médica para un paciente que ya se encuentra en el sistema.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paciente_id
                - diagnostico
              properties:
                paciente_id:
                  type: integer
                  description: ID del paciente
                diagnostico:
                  type: string
                  example: "Consulta de control"
                fecha:
                  type: string
                  format: date
                  description: Fecha de la atención (por defecto hoy)
                consumos:
                  type: array
                  items:
                    type: object
                    properties:
                      id_lote_insumo:
                        type: integer
                      cantidad_usada:
                        type: integer
      responses:
        '201':
          description: Atención registrada exitosamente
        '400':
          description: Datos inválidos o stock insuficiente
        '404':
          description: Paciente o lote no encontrado

  
  

  /inventario/articulos:
    get:
      summary: Listar artículos médicos
      description: Obtiene la lista de todos los artículos médicos registrados en el sistema.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de artículos obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre_articulo:
                          type: string
                        unidad_medida:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
    post:
      summary: Registrar artículo médico
      description: Registra un nuevo artículo médico en el inventario. Este artículo puede luego ser usado para crear lotes. Requiere rol Admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre_articulo
                - unidad_medida
              properties:
                nombre_articulo:
                  type: string
                  description: Nombre del artículo médico
                  example: "Jeringa 10ml"
                unidad_medida:
                  type: string
                  description: Unidad de medida del artículo
                  example: "unidad"
      responses:
        '201':
          description: Artículo registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Artículo médico registrado exitosamente"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      nombre_articulo:
                        type: string
                        example: "Jeringa 10ml"
                      unidad_medida:
                        type: string
                        example: "unidad"
        '400':
          description: Error de validación o artículo duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                campos_faltantes:
                  summary: Campos obligatorios faltantes
                  value:
                    success: false
                    message: "Nombre del artículo y unidad de medida son obligatorios"
                articulo_duplicado:
                  summary: Artículo ya existe
                  value:
                    success: false
                    message: "Ya existe un artículo con ese nombre"
        '403':
          description: Prohibido (Requiere rol Admin)


  /inventario/lotes:
    post:
      summary: Registrar lote de insumos
      description: Registra un nuevo lote de insumos médicos. Requiere rol Admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_articulo
                - numero_lote
                - stock_actual
                - fecha_vencimiento
              properties:
                id_articulo:
                  type: integer
                numero_lote:
                  type: string
                stock_actual:
                  type: integer
                fecha_vencimiento:
                  type: string
                  format: date
      responses:
        '201':
          description: Lote registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/LoteInsumo'
        '400':
          description: Error de validación (fecha vencida, etc.)
        '403':
          description: Prohibido (Requiere rol Admin)

  /inventario:
    get:
      summary: Obtener inventario con alertas
      description: Obtiene la lista de todos los lotes de insumos con alertas de stock bajo y vencimiento.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Inventario obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/LoteInsumo'
                        - type: object
                          properties:
                            articulo:
                              type: object
                              properties:
                                nombre_articulo:
                                  type: string
                                unidad_medida:
                                  type: string
                            alertas:
                              type: object
                              properties:
                                stock_bajo:
                                  type: boolean
                                proximo_vencer:
                                  type: boolean
                                vencido:
                                  type: boolean

  /inventario/reporte:
    get:
      summary: Generar reporte de inventario
      description: Genera un archivo Excel con el estado actual del inventario y alertas.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reporte generado exitosamente
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary


