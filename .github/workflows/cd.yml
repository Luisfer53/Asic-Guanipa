name: DEPLOYMENT PRODUCTION ASIC GUANIPA API

on:
  push:
    tags:
      - "*"
      - "!*alpha*"
      - "!*beta*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: docker build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.ref_name }} .
      - name: login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_USER_TOKEN }}
      - name: docker push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.ref_name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            CONTAINER=asic-guanipa-api \
            TAG=${{ github.ref_name }} \
            IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} \
            /app/create-container \
            --restart unless-stopped \
            --network asic-guanipa-network \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            -e JWT_EXPIRE=${{ secrets.JWT_EXPIRE }} \
            -e SMTP_HOST=${{ secrets.SMTP_HOST }} \
            -e SMTP_USER=${{ secrets.SMTP_USER }} \
            -e SMTP_PORT=${{ secrets.SMTP_PORT }} \
            -e SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
            -e EMAIL_FROM=${{ secrets.EMAIL_FROM }} \
            -e FRONTEND_URL="https://asic-guanipa.online"
