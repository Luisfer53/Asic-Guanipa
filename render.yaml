services:
  - type: web
    name: cdi-pedro-urbina-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_EXPIRE
        value: 24h
      - key: DATABASE_URL
        sync: false # Pega aquí la URL de conexión de Supabase (Pooler o Direct con sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://api.asic-guanipa.online,http://localhost:3000,http://localhost:8080"

